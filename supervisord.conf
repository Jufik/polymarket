; =============================================================================
; Polymarket Process Supervisor
; =============================================================================
; Four groups: ingestion, strategies (one process each), webserver
;
; Usage:
;   uv run supervisord                              # start all (daemonised)
;   uv run supervisord -n                            # start all (foreground)
;   uv run supervisorctl status                      # show process states
;   uv run supervisorctl restart strategies:will_no  # restart one strategy
;   uv run supervisorctl stop strategies:*           # stop all strategies
;   uv run supervisorctl start strategies:*          # start all strategies
;   uv run supervisorctl tail -f strategies:will_no stderr
;   uv run supervisorctl shutdown                    # stop everything
;
; Logs:
;   logs/supervisor/         — stdout/stderr per process
;   logs/paper/<strategy>/   — structured JSON logs + fills + intents (Loki)
; =============================================================================

[supervisord]
logfile          = logs/supervisor/supervisord.log
logfile_maxbytes = 10MB
logfile_backups  = 3
pidfile          = logs/supervisor/supervisord.pid
childlogdir      = logs/supervisor
directory        = %(here)s

[unix_http_server]
file = /tmp/polymarket-supervisor.sock

[inet_http_server]
port = 0.0.0.0:3333

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/polymarket-supervisor.sock

; ---------------------------------------------------------------------------
; Ingestion — live pipeline (RTDS, Alchemy, CLOB WS, PendingBlock, Subgraph)
; ---------------------------------------------------------------------------
[program:ingestion]
command            = %(here)s/.venv/bin/pm-live
directory          = %(here)s
environment        = PYTHONUNBUFFERED="1"
autostart          = true
autorestart        = true
startsecs          = 10
startretries       = 5
stopwaitsecs       = 30
stopsignal         = INT
redirect_stderr    = false
stdout_logfile     = logs/supervisor/ingestion.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 3
stderr_logfile     = logs/supervisor/ingestion.err.log
stderr_logfile_maxbytes = 10MB
stderr_logfile_backups  = 3

; ---------------------------------------------------------------------------
; Strategy: will_no (S2a)
; ---------------------------------------------------------------------------
[program:will_no]
command            = %(here)s/.venv/bin/pm-strategy run --config configs/will_no.toml --log-dir logs/paper/will_no
directory          = %(here)s
environment        = PYTHONUNBUFFERED="1"
autostart          = true
autorestart        = true
startsecs          = 10
startretries       = 5
stopwaitsecs       = 15
stopsignal         = INT
redirect_stderr    = false
stdout_logfile     = logs/supervisor/will_no.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 3
stderr_logfile     = logs/supervisor/will_no.err.log
stderr_logfile_maxbytes = 10MB
stderr_logfile_backups  = 3

; ---------------------------------------------------------------------------
; Strategy: hr_pool (S1 — high hit-rate trader copy)
; ---------------------------------------------------------------------------
[program:hr_pool]
command            = %(here)s/.venv/bin/pm-strategy run --config configs/hr_pool.toml --log-dir logs/paper/hr_pool
directory          = %(here)s
environment        = PYTHONUNBUFFERED="1"
autostart          = true
autorestart        = true
startsecs          = 10
startretries       = 5
stopwaitsecs       = 15
stopsignal         = INT
redirect_stderr    = false
stdout_logfile     = logs/supervisor/hr_pool.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 3
stderr_logfile     = logs/supervisor/hr_pool.err.log
stderr_logfile_maxbytes = 10MB
stderr_logfile_backups  = 3

; ---------------------------------------------------------------------------
; Webserver — FastAPI REST API
; ---------------------------------------------------------------------------
[program:webserver]
command            = %(here)s/.venv/bin/pm-api
directory          = %(here)s
environment        = PYTHONUNBUFFERED="1"
autostart          = false
autorestart        = true
startsecs          = 5
startretries       = 3
stopwaitsecs       = 10
stopsignal         = INT
redirect_stderr    = false
stdout_logfile     = logs/supervisor/webserver.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 3
stderr_logfile     = logs/supervisor/webserver.err.log
stderr_logfile_maxbytes = 10MB
stderr_logfile_backups  = 3

; ---------------------------------------------------------------------------
; Groups — operate on sets of processes
; ---------------------------------------------------------------------------
[group:strategies]
programs = will_no,hr_pool
