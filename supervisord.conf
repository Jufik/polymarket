; ---------------------------------------------------------------------------
; Groups — operate on sets of processes
; ---------------------------------------------------------------------------
[group:ingestors]
programs = ingestion,clob_orderbook,exchange_feed

[group:strategies]
programs = s2_insider_copy,s3_no_sniper,crypto_gbm,portfolio_v3
