[project]
name = "polymarket-pipeline"
version = "0.1.0"
description = "Polymarket unified trade data pipeline"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
sink = ["fastparquet>=2024.0", "pandas>=2.0"]
clickhouse = ["clickhouse-connect>=0.7"]
postgres = ["asyncpg>=0.29"]
websocket = ["websockets>=13.0"]
http = ["httpx>=0.27"]
compact = ["polars>=1.15.0", "pyarrow>=14.0", "duckdb>=1.1"]
exploration = [
    "claude-agent-sdk",
    "mlflow>=2.19.0",
    "typer>=0.14.0",
    "rich>=13.9.0",
    "polars>=1.15.0",
    "clickhouse-connect>=0.7",
]
live = [
    "faststream[kafka]>=0.5",
    "eth-abi>=5.0",
    "websockets>=13.0",
    "gql[aiohttp]>=3.5",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
    "polyfactory>=2.0",
]
all = [
    "polymarket-pipeline[sink,clickhouse,postgres,websocket,http,compact,exploration,live,dev]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[project.scripts]
pm-explore = "polymarket_pipeline.cli.explore:app"
pm-live = "polymarket_pipeline.cli.live:main"
pm-recover = "polymarket_pipeline.cli.recover:main"
pm-backfill = "polymarket_pipeline.cli.backfill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
