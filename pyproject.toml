[project]
name = "polymarket-pipeline"
version = "0.1.0"
description = "Polymarket unified trade data pipeline"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3",
    "marimo>=0.20.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "plotly>=6.5.2",
    "pm-core",
    "pm-ingest",
    "pm-store",
    "pm-strategy",
    "pm-backtest",
    "pm-pipeline",
    "pm-api",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "scipy>=1.17.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
sink = ["fastparquet>=2024.0", "pandas>=2.0"]
clickhouse = ["clickhouse-connect>=0.7"]
postgres = ["asyncpg>=0.29", "alembic>=1.14"]
websocket = ["websockets>=13.0"]
http = ["httpx>=0.27"]
compact = ["polars>=1.15.0", "pyarrow>=14.0", "duckdb>=1.1"]
exploration = [
    "claude-agent-sdk",
    "mlflow>=2.19.0",
    "typer>=0.14.0",
    "rich>=13.9.0",
    "polars>=1.15.0",
    "clickhouse-connect>=0.7",
]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "prometheus-client>=0.21"]
live = [
    "faststream[kafka]>=0.5",
    "eth-abi>=5.0",
    "order-book>=0.4",
    "redis>=5.0",
    "msgpack>=1.0",
    "websockets>=13.0",
    "gql[aiohttp]>=3.5",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
    "cryptofeed>=2.4",
]
mempool = [
    "polymarket-mempool",
]
strategy = [
    "polars>=1.15.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "optuna>=3.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
    "polyfactory>=2.0",
    "fakeredis>=2.20",
]
all = [
    "polymarket-pipeline[sink,clickhouse,postgres,websocket,http,compact,exploration,api,live,mempool,strategy,dev]",
]
ops = [
    "supervisor>=4.3.0",
]
cryptofeed = [
    "cryptofeed>=2.4",
    "polars>=1.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"packages/pm-api/src/pm_api/app.py" = ["E501"]  # CSS-in-Python dashboard template
"packages/pm-ingest/src/pm_ingest/ingestors/*.py" = ["SIM105", "SIM108"]  # explicit ws/network cleanup
"packages/pm-ingest/src/pm_ingest/normalize/decode.py" = ["SIM108"]  # clear if/else for readability
"packages/pm-ingest/src/pm_ingest/reconciler.py" = ["SIM105"]  # explicit async cleanup
"packages/pm-store/src/pm_store/parquet/checkpoint.py" = ["SIM105"]  # explicit file cleanup

[project.scripts]
pm-api = "polymarket_pipeline.api.app:main"
pm-panic = "polymarket_pipeline.cli.panic:main"
pm-explore = "polymarket_pipeline.cli.explore:app"
pm-live = "polymarket_pipeline.cli.live:main"
pm-recover = "polymarket_pipeline.cli.recover:main"
pm-backfill = "polymarket_pipeline.cli.backfill:main"
pm-sync = "polymarket_pipeline.cli.sync:main"
pm-compact = "polymarket_pipeline.cli.compact:main"
pm-load = "polymarket_pipeline.cli.load:main"
pm-build = "polymarket_pipeline.cli.build:main"
pm-migrate = "polymarket_pipeline.cli.migrate:main"
pm-strategy = "polymarket_pipeline.cli.strategy:app"
pm-harness = "polymarket_pipeline.cli.harness:app"
pm-clob = "polymarket_pipeline.cli.clob:main"
pm-exchange = "polymarket_pipeline.cli.exchange:main"
pm-ctf-recover = "polymarket_pipeline.cli.ctf_recover:main"
pm-config = "pm_pipeline.cli.config:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
polymarket-mempool = { path = "crates/polymarket-mempool", editable = true }
pm-core = { workspace = true }
pm-ingest = { workspace = true }
pm-store = { workspace = true }
pm-strategy = { workspace = true }
pm-backtest = { workspace = true }
pm-pipeline = { workspace = true }
pm-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
