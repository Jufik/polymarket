services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "18123:8123"   # HTTP
      - "19000:9000"   # Native
    volumes:
      - ./docker-drives/clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml
      - ./docker/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml
    environment:
      CLICKHOUSE_DB: polymarket
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    mem_limit: 24g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    ports:
      - "15521:5521"
    command: ["node", "./node_modules/.bin/serve", "-s", "-l", "tcp://0.0.0.0:5521", "/app"]
    environment:
      VITE_CLICKHOUSE_URL: http://clickhouse:8123
      VITE_CLICKHOUSE_USER: default
      VITE_CLICKHOUSE_PASS: ""
    depends_on:
      - clickhouse

  postgres:
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    volumes:
      - ./docker-drives/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: polymarket
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5050:5050"
    volumes:
      - ./docker-drives/mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5050
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/artifacts
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda start
      - --smp 2
      - --memory 4G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:18082
      - --advertise-pandaproxy-addr localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    volumes:
      - ./docker-drives/redpanda:/var/lib/redpanda/data

  redpanda-console:
    image: redpandadata/console:v2.8.0
    ports:
      - "18080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda

  polymarket-app:
    build: .
    env_file: .env
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8099/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "8099:8099"

