services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "18123:8123"   # HTTP
      - "19000:9000"   # Native
    volumes:
      - ./docker-drives/clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml
      - ./docker/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml
      - ./docker/clickhouse/query_defaults.xml:/etc/clickhouse-server/users.d/query_defaults.xml
    environment:
      CLICKHOUSE_DB: polymarket
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    mem_limit: 96g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    ports:
      - "15521:5521"
    command: ["node", "./node_modules/.bin/serve", "-s", "-l", "tcp://0.0.0.0:5521", "/app"]
    environment:
      VITE_CLICKHOUSE_URL: http://clickhouse:8123
      VITE_CLICKHOUSE_USER: default
      VITE_CLICKHOUSE_PASS: ""
    depends_on:
      - clickhouse

  postgres:
    image: postgres:16-alpine
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    ports:
      - "15432:5432"
    volumes:
      - ./docker-drives/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: polymarket
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5050:5050"
    volumes:
      - ./docker-drives/mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5050
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/artifacts
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda start
      - --smp 2
      - --memory 4G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:18082
      - --advertise-pandaproxy-addr localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    volumes:
      - ./docker-drives/redpanda:/var/lib/redpanda/data

  redpanda-console:
    image: redpandadata/console:v2.8.0
    ports:
      - "18080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda

  polymarket-app:
    build: .
    env_file: .env
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8099/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "8099:8099"

  polymarket-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pm-api"]
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - polymarket-api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3030:3000"
    volumes:
      - ./docker-drives/metabase:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
    depends_on:
      clickhouse:
        condition: service_healthy

  polymarket-ui:
    build: ./ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://polymarket-api:8000
    depends_on:
      - polymarket-api

