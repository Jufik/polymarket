# Crypto GBM scalp strategy — paper execution config
# Buys underpriced PM side when GBM fair value diverges from PM price,
# sells on convergence (scalp) or near window end (time-stop).
#
# Validated: 71.1% profitable, +4.2% median PnL, 14s median hold (tick-by-tick)

[strategy.crypto_gbm]
enabled = true
mode = "paper_dev"
capital_usd = 500
max_position_usd = 50
max_open_positions = 20
cooldown_s = 0
features = ["crypto_windows", "exchange_prices"]

[strategy.crypto_gbm.params]
# Entry
threshold = 0.10
base_bet_usd = 50
min_sigma = 1e-7
max_spread = 0.04
min_time_remaining_min = 1.5
skip_minute_zero = true
fee_pct = 0.03
min_gbm_deviation = 0.05
primary_exchange = "BINANCE"
primary_symbol = "BTC-USDT"
# Scalp exit
scalp_enabled = true
exit_threshold = 0.02
exit_min_time_remaining_s = 30.0
no_entry_within_s = 90.0

[provider.crypto_windows]
enabled = true
refresh_interval_s = 60

[provider.exchange_prices]
enabled = true
refresh_interval_s = 3600

[provider.exchange_prices.params]
primary_exchange = "BINANCE"
primary_symbol = "BTC-USDT"
sigma_lookback_min = 1440
