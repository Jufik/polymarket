# S1 Hit-Rate Copy-Trading Strategy
#
# Copies trades from high-hit-rate specialist traders when consensus
# of qualified traders agree on the same directional position.
#
# Usage:
#   uv run pm-strategy run --config configs/s1_hitrate_copy.toml
#   uv run pm-strategy run --config configs/s1_hitrate_copy.toml --verbose

[strategy.s1_hitrate_copy]
enabled = true
mode = "paper_dev"
capital_usd = 1000.0
max_position_usd = 10.0
max_open_positions = 50
cooldown_s = 0
features = ["s1_hitrate"]
subscribe_pending = false

[strategy.s1_hitrate_copy.params]
size_usd = 10.0               # base bet (used when sizing_mode = "fixed")
min_dir_price = 0.60
max_dir_price = 0.90
min_specialization = 0.70
min_last5 = 1
min_consensus = 4
max_hold_hours = 168.0           # skip markets that close > 7 days from now
# Compounding sizing: "fixed" = constant size_usd, "fractional" = bankroll * fraction
sizing_mode = "fractional"
sizing_fraction = 0.02         # 2% of bankroll per position (= bankroll / 50)
max_bet_usd = 500.0            # liquidity cap — linear growth above bankroll/$25K

[provider.s1_hitrate]
enabled = true
refresh_interval_s = 900   # re-query CH every 15 min

[provider.s1_hitrate.params]
lookback_months = 9
min_positions = 20
min_hr = 0.75
initial_bankroll = 500.0       # starting capital for fractional sizing

[promotion]
min_trades = 100
min_sharpe = 0.5
min_fills = 50
min_runtime_hours = 168    # 7 days paper_dev before paper_prod
max_drawdown = 200.0
