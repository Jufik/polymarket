# Crypto GBM scalp strategy — SOL paper execution config
# Same GBM model as BTC, adapted for Solana volatility profile.
# SOL vol ~1.64x BTC → threshold scaled, position sized down (thinner liquidity).

[strategy.crypto_gbm_sol]
enabled = true
mode = "paper_dev"
capital_usd = 1000000000
max_position_usd = 25
max_open_positions = 20
cooldown_s = 0
features = ["crypto_windows", "exchange_prices"]

[strategy.crypto_gbm_sol.params]
# Entry — threshold scaled by SOL/BTC vol ratio (1.64x)
threshold = 0.164
base_bet_usd = 25
min_sigma = 1e-7
max_spread = 0.04
min_time_remaining_min = 2.0
skip_minute_zero = true
skip_seconds = 20.0              # skip first 20s (was 60s)
fee_schedule = "crypto"
fee_aware_threshold = true
min_gbm_deviation = 0.05
primary_exchange = "BINANCE"
primary_symbol = "SOL-USDT"
asset_name = "Solana"
# Dynamic sizing: disabled
dynamic_sizing = false
# EWMA sigma: critical for SOL — volatile regime shifts
use_ewma_sigma = true
ewma_sigma_span = 1440
# Realtime sigma from 1s bars: updates every bar (no minute-boundary lag)
use_realtime_sigma = true
sigma_rt_lookback_s = 1800
# Time-decaying threshold: SOL base 0.164 → at minute 3: ~0.104, minute 4: ~0.073
decay_threshold = true
threshold_decay_power = 0.5
threshold_floor = 0.05             # highest floor — SOL most volatile
# Re-entry: allow re-entering same window after a scalp exit
allow_reentry = true
# Exit
scalp_enabled = true
exit_threshold = 0.02
exit_min_time_remaining_s = 30.0
no_entry_within_s = 90.0
trailing_stop_gap = 0.05
gbm_flip_threshold = 0.35
gbm_flip_confirm_ticks = 5     # require 5 consecutive ticks below threshold (~25s)
hold_to_resolution_threshold = 0.65
min_book_ratio = 0.3

[provider.crypto_windows]
enabled = true
refresh_interval_s = 60

[provider.crypto_windows.params]
asset_name = "Solana"

[provider.exchange_prices]
enabled = true
refresh_interval_s = 3600

[provider.exchange_prices.params]
primary_exchange = "BINANCE"
primary_symbol = "SOL-USDT"
sigma_lookback_min = 1440
sigma_rt_lookback_s = 1800
