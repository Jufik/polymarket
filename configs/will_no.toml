# Will-NO — Buy NO on binary "Will X happen?" niche markets
#
# Implementation-validated: +47.1% ROI, 80.4% HR, ~140 sigs/month, $3,098/mo PnL
# Niche: sports draws ("between"), MLB, Grand Prix, leagues, finance ("fed", "traded")
# 12 price bands 10-70%, volume < $2K (trade-level, NOT Gamma event_volume)
# 17/17 rolling 3-month windows profitable (100%)

[strategy.will_no]
enabled = true
mode = "paper_dev"
capital_usd = 10000
max_position_usd = 150
max_open_positions = 100
cooldown_s = 0
features = ["will_markets", "market_size"]

[strategy.will_no.params]
base_bet_usd = 50
fee_pct = 0.0
max_volume_usd = 2000
volume_column = "market_volume"
max_bucket = "med"
# Niche keywords — data-derived, implementation-validated
prefer_keywords = ["between", "mlb", "prix", "grand", "league", "park", "traded", "fed"]
avoid_keywords = ["reach", "hit"]

[provider.will_markets]
enabled = true
refresh_interval_s = 900

[provider.will_markets.params]
question_pattern = "^Will\\b"

[provider.market_size]
enabled = true
refresh_interval_s = 1800

[provider.market_size.params]
model_path = "models/market_size_xgb.joblib"
