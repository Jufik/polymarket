[project]
name = "pm-pipeline"
version = "0.1.0"
description = "Polymarket pipeline orchestration: quality, lifecycle, CLI, LiveRunner"
requires-python = ">=3.11"
dependencies = [
    "pm-core",
    "pm-ingest",
    "pm-store",
    "pm-strategy",
    "pm-backtest",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
kafka = ["faststream[kafka]>=0.5"]
postgres = ["asyncpg>=0.29"]
clickhouse = ["clickhouse-connect>=0.7"]
http = ["httpx>=0.27"]
execution = ["redis>=5.0", "websockets>=13.0"]
all = ["pm-pipeline[kafka,postgres,clickhouse,http,execution]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
