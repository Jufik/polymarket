[project]
name = "pm-core"
version = "0.1.0"
description = "Polymarket pipeline core types, models, and protocols"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
config = ["redis>=5.0"]
dev = ["pytest>=8.0", "fakeredis>=2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
