[project]
name = "pm-api"
version = "0.1.0"
description = "Polymarket REST API: parameterized queries, structured errors, pagination"
requires-python = ">=3.11"
dependencies = [
    "pm-core",
    "pm-store",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
